<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600&family=Inter:wght@200;300;400;600&family=Montserrat:wght@200;300;400&display=swap"

    <style>
        .contact-form {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ce0000;
            box-shadow: 0 0 0 3px rgba(206, 0, 0, 0.1);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: #ce0000;
            color: white;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .submit-btn:hover {
            background: #a00000;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(206, 0, 0, 0.3);
        }

        .contact-info {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .contact-info p {
            margin: 0.5rem 0;
            color: #555;
        }

        .contact-info a {
            color: #ce0000;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        .status-message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>

<body>

    <!-- Back Navigation -->
    <a href="index.html" class="back-nav">&larr; Back to Home</a>

    <div class="legal-container fade-in">
        <h1>Contact Us</h1>
        <div class="legal-content">
            <div id="statusMessage" class="status-message"></div>
            <form class="contact-form" action="send_contact.php" method="post">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div class="contact-info">
                <p><strong>Direct Contact</strong></p>
                <p>Email: <a href="mailto:info@alaive.de">info@alaive.de</a></p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="impressum.html">Impressum</a>

            <a href="contact.html">Contact</a>
        </div>

    </footer>


    <script>
        window.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const msg = urlParams.get('msg');
            const statusDiv = document.getElementById('statusMessage');

            if (status === 'success') {
                statusDiv.textContent = '✓ Message sent successfully! We\'ll get back to you soon.';
                statusDiv.className = 'status-message success';
                document.querySelector('.contact-form').reset();
                setTimeout(() => {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }, 100);
            } else if (status === 'error') {
                let errorText = '✗ Error sending message. Please try again.';
                if (msg === 'missing') errorText = '✗ Please fill in all required fields.';
                if (msg === 'invalid_email') errorText = '✗ Please enter a valid email address.';
                if (msg === 'send_failed') errorText = '✗ Failed to send message. Please try again later or email us directly.';
                statusDiv.textContent = errorText;
                statusDiv.className = 'status-message error';
            }
        });
    </script>

</body>
